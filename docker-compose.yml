services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/konfio-warehouse

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
      PYSPARK_PYTHON: python3
      KONFIO_PROJECT_ENVIRONMENT: docker
      KONFIO_ICEBERG_STORAGE_TYPE: minio
      KONFIO_ICEBERG_WAREHOUSE_PATH: s3a://konfio-warehouse/
      KONFIO_ICEBERG_S3_ENDPOINT: http://minio:9000
      KONFIO_ICEBERG_S3_ACCESS_KEY_ID: minioadmin
      KONFIO_ICEBERG_S3_SECRET_ACCESS_KEY: minioadmin
      KONFIO_ICEBERG_S3_PATH_STYLE_ACCESS: "true"
      KONFIO_OUTPUT_EVENTS_PATH: /app/events
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./events:/app/events

  jupyter:
    profiles: ["notebook"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
      PYSPARK_PYTHON: python3
      KONFIO_PROJECT_ENVIRONMENT: docker
      KONFIO_ICEBERG_STORAGE_TYPE: minio
      KONFIO_ICEBERG_WAREHOUSE_PATH: s3a://konfio-warehouse/
      KONFIO_ICEBERG_S3_ENDPOINT: http://minio:9000
      KONFIO_ICEBERG_S3_ACCESS_KEY_ID: minioadmin
      KONFIO_ICEBERG_S3_SECRET_ACCESS_KEY: minioadmin
      KONFIO_ICEBERG_S3_PATH_STYLE_ACCESS: "true"
    depends_on:
      pipeline:
        condition: service_completed_successfully
    ports:
      - "8888:8888"
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=
      - --ServerApp.allow_origin=http://localhost:8888
      - --notebook-dir=/app/notebooks

volumes:
  minio_data:
